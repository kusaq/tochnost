services:
  app:
    image: tochnost:latest
    container_name: tochnost_app
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.app
    ports:
      - "8000:${APP_PORT:-8000}"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: tochnost_postgres
    image: timescale/timescaledb:2.23.1-pg17
    tty: true
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB' ]
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    container_name: tochnost_redis
    image: redis:8.0-alpine
    environment:
      - TZ=Europe/Moscow
    env_file:
      - .env
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s
    command: ["redis-server", "--requirepass", "$REDIS_PASSWORD"]

volumes:
  pg_data:
  redis_data: